[project]
name = "rag-model-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "fastapi[standard]>=0.143.0",
    "nltk>=3.10.3",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.0.0",
]

[project.scripts]
rag-model-fastapi = "rag_model_fastapi:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
