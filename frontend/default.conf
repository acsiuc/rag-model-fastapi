limit_req_zone $binary_remote_addr zone=questions_limit:10m rate=3r/m;

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location  /ask {
        limit_req zone=questions_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass   http://rag-api:8000;
    }

}