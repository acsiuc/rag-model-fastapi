name: ci
on: 
  push:
    branches:
      - main
jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Run ruff
        run: uv run --only-group dev ruff check
      - name: Install Node
        uses: actions/setup-node@v4
        with: 
          node-version: 24
      - name: Install dependencies for frontend
        run: npm ci
        working-directory: frontend
      - name: Run linter for frontend
        run: npm run lint
        working-directory: frontend
      - name: Build the frontend image
        run: docker build ./frontend
      - name: Build the API image
        run: docker build .