services:
  rag-postgres:
    image: pgvector/pgvector:pg17
    container_name: rag-postgres
    environment: 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rag
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - rag-pgdata:/var/lib/postgresql/data

volumes: 
  rag-pgdata:

